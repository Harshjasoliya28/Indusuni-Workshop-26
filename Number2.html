<html>
<head>
<script>
    document.write("<table border='1'>");
    for (var i = 1; i <= 100; i++) {
        if ((i - 1) % 10 == 0) {
            document.write("<tr>");
        }
        document.write("<td>" + i + "</td>");
        if (i % 10 == 0) {
            document.write("</tr>");
        }
    }
    document.write("</table>");
</script>
</head>
<body>
</body>
</html>
