<html>  
<head>
    <script>
        document.write("<table border='1'>");
            for (var i = 1; i <= 1000; i++) {
                document.write("<tr>");
                    if(i%2==0){
                        document.write("<td bgcolor='lightblue'>"+i+"</td>");
                    } else {
                        document.write("<td bgcolor='lightgray'>"+i+"</td>");
                    }
                   
                document.write("</tr>");
            }
    </script>
</head>
